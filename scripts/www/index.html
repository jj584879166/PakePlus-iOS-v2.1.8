<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="拼音学习大师">
<title>拼音学习大师</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"PingFang SC","Microsoft YaHei",sans-serif}
body{background:#f0f2f0;padding:20px}
.container{max-width:900px;margin:0 auto}
h1{text-align:center;color:#333;margin-bottom:20px;font-size:26px}
.tab-buttons{display:flex;justify-content:center;gap:4px;margin-bottom:15px;overflow-x:auto;padding-bottom:5px}
.tab-btn{padding:6px 9px;border:none;border-radius:8px;background:#fff;color:#666;font-size:12px;font-weight:bold;white-space:nowrap;cursor:pointer;box-shadow:0 2px 8px #0001}
.tab-btn.active{background:#ffd166;color:#333}
.refresh-btn{margin:0 auto 15px;display:block;padding:6px 14px;border-radius:10px;border:none;font-size:14px;font-weight:bold;background:#4a6fa5;color:#fff;cursor:pointer;box-shadow:0 3px 10px #4a6fa533}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:20px}
.card{aspect-ratio:1/1;position:relative;cursor:pointer;transform-style:preserve-3d;transition:.4s transform}
.card.flipped{transform:rotateY(180deg)}
.card-face{position:absolute;width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:45px;font-weight:bold;border-radius:14px;backface-visibility:hidden;box-shadow:0 4px 10px #0002}
.card-back{background:#4a6fa5;color:#fff}
.card-front{background:#fff;color:#222;transform:rotateY(180deg)}
#total-board,#all-board{grid-template-columns:repeat(5,1fr)}
.pinyin-lab{display:none;background:#fff;border-radius:16px;padding:15px;box-shadow:0 5px 15px #0001;margin-bottom:20px}
.pinyin-lab.active{display:block}
.lab-title{font-size:18px;text-align:center;color:#4a6fa5;margin-bottom:15px;font-weight:bold}
.selector-group{margin-bottom:15px}
.selector-label{display:block;font-size:15px;font-weight:bold;color:#333;margin-bottom:8px}
.selector-buttons{display:flex;flex-wrap:wrap;gap:5px;justify-content:center}
.selector-btn{padding:8px 9px;border:2px solid #ddd;border-radius:8px;background:#f8f9fa;font-size:16px;font-weight:bold;cursor:pointer}
.selector-btn.active{background:#4a6fa5;color:#fff;border-color:#4a6fa5}
.tone-btn{font-size:14px;padding:8px 6px}
.result-area{text-align:center;padding:15px;background:#f0f8ff;border-radius:12px;margin-top:15px}
.result-label{font-size:16px;color:#666;margin-bottom:8px}
.pinyin-result{font-size:50px;font-weight:bold;color:#e67e22;height:70px;line-height:70px}
</style>
</head>
<body>
<div class="container">
  <h1>拼音学习大师</h1>
  <div class="tab-buttons">
    <button class="tab-btn" data-target="shengmu">声母表</button>
    <button class="tab-btn" data-target="yunmu">韵母表</button>
    <button class="tab-btn" data-target="yinjie">整体认读</button>
    <button class="tab-btn" data-target="total">声母+韵母</button>
    <button class="tab-btn" data-target="all">全部拼音</button>
    <button class="tab-btn active" data-target="pinyinlab">拼音拼读</button>
  </div>
  <button class="refresh-btn" id="refreshBtn">🔄 刷新 / 重新打乱</button>
  <div id="shengmu-board" class="board" style="display:none"></div>
  <div id="yunmu-board" class="board" style="display:none"></div>
  <div id="yinjie-board" class="board" style="display:none"></div>
  <div id="total-board" class="board" style="display:none"></div>
  <div id="all-board" class="board" style="display:none"></div>
  <div id="pinyinlab-board" class="pinyin-lab active">
    <div class="lab-title">拼音拼读实验室</div>
    <div class="selector-group">
      <div class="selector-label">1. 选择声母</div>
      <div class="selector-buttons" id="shengmu-selector">
        <button class="selector-btn">无</button>
        <button class="selector-btn">b</button><button class="selector-btn">p</button><button class="selector-btn">m</button><button class="selector-btn">f</button>
        <button class="selector-btn">d</button><button class="selector-btn">t</button><button class="selector-btn">n</button><button class="selector-btn">l</button>
        <button class="selector-btn">g</button><button class="selector-btn">k</button><button class="selector-btn">h</button>
        <button class="selector-btn">j</button><button class="selector-btn">q</button><button class="selector-btn">x</button>
        <button class="selector-btn">zh</button><button class="selector-btn">ch</button><button class="selector-btn">sh</button><button class="selector-btn">r</button>
        <button class="selector-btn">z</button><button class="selector-btn">c</button><button class="selector-btn">s</button>
        <button class="selector-btn">y</button><button class="selector-btn">w</button>
      </div>
    </div>
    <div class="selector-group">
      <div class="selector-label">2. 选择韵母</div>
      <div class="selector-buttons" id="yunmu-selector">
        <button class="selector-btn">a</button><button class="selector-btn">o</button><button class="selector-btn">e</button><button class="selector-btn">i</button>
        <button class="selector-btn">u</button><button class="selector-btn">ü</button><button class="selector-btn">ai</button><button class="selector-btn">ei</button>
        <button class="selector-btn">ui</button><button class="selector-btn">ao</button><button class="selector-btn">ou</button><button class="selector-btn">iu</button>
        <button class="selector-btn">ie</button><button class="selector-btn">üe</button><button class="selector-btn">er</button><button class="selector-btn">an</button>
        <button class="selector-btn">en</button><button class="selector-btn">in</button><button class="selector-btn">un</button><button class="selector-btn">ün</button>
        <button class="selector-btn">ang</button><button class="selector-btn">eng</button><button class="selector-btn">ing</button><button class="selector-btn">ong</button>
      </div>
    </div>
    <div class="selector-group">
      <div class="selector-label">3. 选择声调</div>
      <div class="selector-buttons" id="tone-selector">
        <button class="selector-btn tone-btn active" data-tone="0">轻声</button>
        <button class="selector-btn tone-btn" data-tone="1">一声</button>
        <button class="selector-btn tone-btn" data-tone="2">二声</button>
        <button class="selector-btn tone-btn" data-tone="3">三声</button>
        <button class="selector-btn tone-btn" data-tone="4">四声</button>
      </div>
    </div>
    <div class="result-area">
      <div class="result-label">合成结果</div>
      <div class="pinyin-result" id="final-result">请选择拼音</div>
    </div>
  </div>
</div>
<script>
const shengmuList = ['b','p','m','f','d','t','n','l','g','k','h','j','q','x','zh','ch','sh','r','z','c','s','y','w'];
const yunmuList = ['a','o','e','i','u','ü','ai','ei','ui','ao','ou','iu','ie','üe','er','an','en','in','un','ün','ang','eng','ing','ong'];
const zhengtiList = ['zhi','chi','shi','ri','zi','ci','si','yi','wu','yu','ye','yue','yuan','yin','yun','ying'];
const totalList = [...shengmuList, ...yunmuList];
const allList = [...shengmuList, ...yunmuList, ...zhengtiList];

function shuffle(a){const n=[...a];for(let i=n.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[n[i],n[j]]=[n[j],n[i]]}return n}
function card(t){return`<div class="card"><div class="card-face card-back"></div><div class="card-face card-front">${t}</div></div>`}
function render(id,data){const e=document.getElementById(id);e.innerHTML=shuffle(data).map(card).join('');e.querySelectorAll('.card').forEach(c=>c.addEventListener('click',()=>c.classList.toggle('flipped')))}

function refresh(){
  const t=document.querySelector('.tab-btn.active').dataset.target;
  if(t==='pinyinlab')return;
  switch(t){
    case'shengmu':render('shengmu-board',shengmuList);break;
    case'yunmu':render('yunmu-board',yunmuList);break;
    case'yinjie':render('yinjie-board',zhengtiList);break;
    case'total':render('total-board',totalList);break;
    case'all':render('all-board',allList);break
  }
}

const tabs=document.querySelectorAll('.tab-btn'),boards=document.querySelectorAll('.board'),lab=document.querySelector('.pinyin-lab'),refBtn=document.getElementById('refreshBtn');
tabs.forEach(b=>b.addEventListener('click',()=>{
  const t=b.dataset.target;
  tabs.forEach(x=>x.classList.remove('active'));
  boards.forEach(x=>x.style.display='none');
  lab.classList.remove('active');
  refBtn.style.display='block';
  b.classList.add('active');
  if(t==='pinyinlab'){lab.classList.add('active');refBtn.style.display='none'}
  else{document.getElementById(t+'-board').style.display='grid';refresh()}
}))

refBtn.addEventListener('click',refresh)

// ==============================
// 拼读逻辑 + 合法拼音校验
// ==============================
let sheng = '', yun = '', tone = 0;

const toneMap = {
  a: ['a','ā','á','ǎ','à'],
  o: ['o','ō','ó','ǒ','ò'],
  e: ['e','ē','é','ě','è'],
  i: ['i','ī','í','ǐ','ì'],
  u: ['u','ū','ú','ǔ','ù'],
  ü: ['ü','ǖ','ǘ','ǚ','ǜ']
};

// 声母选择
document.querySelectorAll('#shengmu-selector .selector-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#shengmu-selector .selector-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    sheng = btn.textContent === '无' ? '' : btn.textContent;
    update();
  });
});

// 韵母选择
document.querySelectorAll('#yunmu-selector .selector-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#yunmu-selector .selector-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    yun = btn.textContent;
    update();
  });
});

// 声调选择
document.querySelectorAll('#tone-selector .selector-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#tone-selector .selector-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    tone = parseInt(btn.dataset.tone);
    update();
  });
});

// 核心：判断是否合法拼音
function isValidPinyin(s, y) {
  // er 不能跟任何声母拼
  if (y === 'er' && s !== '') return false;

  // j q x 不跟 u 相拼，只跟 ü 相拼
  if (['j','q','x'].includes(s) && y === 'u') return false;

  // b p m f 不跟 ü 相拼
  if (['b','p','m','f'].includes(s) && y === 'ü') return false;

  // z c s zh ch sh r 不跟 ü / üe / ün 相拼
  const zcsList = ['z','c','s','zh','ch','sh','r'];
  if (zcsList.includes(s) && ['ü','üe','ün'].includes(y)) return false;

  // j q x 不跟 ai ei ao ou 相拼
  if (['j','q','x'].includes(s) && ['ai','ei','ao','ou'].includes(y)) return false;

  // b p m f 不跟 ong 相拼
  if (['b','p','m','f'].includes(s) && y === 'ong') return false;

  // f 不跟 ing 相拼
  if (s === 'f' && y === 'ing') return false;

  // g k h 不跟 ing 相拼
  if (['g','k','h'].includes(s) && y === 'ing') return false;

  return true;
}

function update() {
  const el = document.getElementById('final-result');
  if (!yun) { el.textContent = '请选择韵母'; return; }

  // 非法组合
  if (!isValidPinyin(sheng, yun)) {
    el.textContent = '❌ 不能拼读';
    return;
  }

  // 合法 → 标声调
  let res = yun;
  const order = ['a','o','e','i','u','ü'];
  for (let v of order) {
    if (res.includes(v)) {
      res = res.replace(v, toneMap[v][tone]);
      break;
    }
  }
  el.textContent = (sheng || '') + res;
}

// 初始化
render('shengmu-board',shengmuList);
render('yunmu-board',yunmuList);
render('yinjie-board',zhengtiList);
render('total-board',totalList);
render('all-board',allList);
</script>
</body>
</html>
